<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿均的國語魔法森林</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 50%, #228B22 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* 森林背景裝飾 */
        .forest-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .tree {
            position: absolute;
            bottom: 0;
            font-size: 4rem;
            opacity: 0.3;
            animation: sway 4s ease-in-out infinite;
        }

        .tree:nth-child(1) { left: 5%; animation-delay: 0s; }
        .tree:nth-child(2) { left: 15%; animation-delay: 0.5s; font-size: 5rem; }
        .tree:nth-child(3) { left: 25%; animation-delay: 1s; }
        .tree:nth-child(4) { right: 25%; animation-delay: 1.5s; font-size: 5rem; }
        .tree:nth-child(5) { right: 15%; animation-delay: 2s; }
        .tree:nth-child(6) { right: 5%; animation-delay: 2.5s; font-size: 4.5rem; }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* 飄落樹葉 */
        .leaf {
            position: absolute;
            font-size: 1.5rem;
            animation: falling linear infinite;
            opacity: 0.7;
        }

        @keyframes falling {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 漂浮動物 */
        .floating-animal {
            position: absolute;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(-10px) translateX(-5px); }
            75% { transform: translateY(-25px) translateX(5px); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* 音效按鈕 */
        .sound-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .sound-btn:hover {
            transform: scale(1.1);
        }

        /* 歡迎畫面 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-mascot {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .welcome-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #15803d;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 1.3rem;
            color: #166534;
            margin-bottom: 30px;
        }

        .welcome-card {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
        }

        .welcome-message {
            font-size: 1.2rem;
            color: #374151;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .name-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            border: 3px solid #86efac;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-family: inherit;
            transition: all 0.3s;
        }

        .name-input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34,197,94,0.3);
        }

        .start-btn {
            width: 100%;
            padding: 18px 30px;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(34,197,94,0.4);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(34,197,94,0.5);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* 主選單 */
        .main-menu {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        /* 玩家資訊卡 */
        .player-card {
            background: rgba(255,255,255,0.95);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .player-avatar {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #fef3c7, #fcd34d);
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(251,191,36,0.3);
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .player-info {
            flex: 1;
            min-width: 150px;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #374151;
        }

        .player-title {
            font-size: 0.95rem;
            color: #16a34a;
            font-weight: 600;
            background: #dcfce7;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
        }

        .player-stats {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-icon {
            font-size: 1.8rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #374151;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #6b7280;
        }

        /* 經驗值進度條 */
        .exp-bar-container {
            width: 100%;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .exp-bar-label {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .exp-bar {
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #86efac);
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }

        .exp-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        /* 關卡選擇區 */
        .levels-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #15803d;
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }

        .level-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .level-card:hover:not(.locked) {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .level-card.locked {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .level-header {
            height: 8px;
        }

        .level-header.mushroom { background: linear-gradient(90deg, #ef4444, #f97316); }
        .level-header.oak { background: linear-gradient(90deg, #22c55e, #84cc16); }
        .level-header.firefly { background: linear-gradient(90deg, #eab308, #facc15); }
        .level-header.treehouse { background: linear-gradient(90deg, #8b5cf6, #a855f7); }
        .level-header.rainbow { background: linear-gradient(90deg, #ec4899, #f43f5e, #f97316, #eab308, #22c55e, #06b6d4, #8b5cf6); }
        .level-header.synonym { background: linear-gradient(90deg, #06b6d4, #0ea5e9); }
        .level-header.antonym { background: linear-gradient(90deg, #ec4899, #d946ef); }
        .level-header.radical { background: linear-gradient(90deg, #f97316, #fb923c); }
        .level-header.measure { background: linear-gradient(90deg, #c026d3, #d946ef); }
        .level-header.hamster { background: linear-gradient(90deg, #fbbf24, #f59e0b, #f97316); }
        .level-header.adjective { background: linear-gradient(90deg, #10b981, #059669); }
        .level-header.verb { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .level-header.poetry { background: linear-gradient(90deg, #7c3aed, #6d28d9); }
        .level-header.number { background: linear-gradient(90deg, #dc2626, #b91c1c); }
        .level-header.color { background: linear-gradient(90deg, #ec4899, #f97316, #eab308, #22c55e, #06b6d4, #8b5cf6); }
        .level-header.punctuation { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .level-header.opposite { background: linear-gradient(90deg, #14b8a6, #0d9488); }
        .level-header.sound { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
        .level-header.metaphor { background: linear-gradient(90deg, #ec4899, #db2777); }
        .level-header.master { background: linear-gradient(90deg, #fbbf24, #f59e0b, #f97316, #ec4899, #8b5cf6); }

        .level-content {
            padding: 25px 15px;
            text-align: center;
        }

        .level-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .level-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 5px;
        }

        .level-desc {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .level-progress {
            height: 6px;
            background: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .level-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #86efac);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .level-score {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .level-lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            border-radius: 20px;
        }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .lock-text {
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* 遊戲畫面 */
        .game-screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .game-header {
            background: rgba(255,255,255,0.95);
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }

        .game-level-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #15803d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-progress {
            font-size: 1rem;
            color: #6b7280;
            font-weight: 600;
        }

        .game-hearts {
            display: flex;
            gap: 8px;
            font-size: 1.8rem;
        }

        .heart {
            transition: all 0.3s;
        }

        .heart.lost {
            filter: grayscale(100%);
            opacity: 0.4;
            transform: scale(0.9);
        }

        .back-btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            background: #f3f4f6;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #e5e7eb;
            color: #374151;
        }

        /* 題目區 */
        .question-area {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .question-image {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 15px;
        }

        .question-hint {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 答案按鈕 */
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .answer-btn {
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #374151;
            background: white;
            border: 3px solid #e5e7eb;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: #22c55e;
            background: #f0fdf4;
            transform: translateY(-3px);
        }

        .answer-btn.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            animation: correct 0.5s ease;
        }

        @keyframes correct {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .answer-btn.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #dc2626;
            animation: wrong 0.5s ease;
        }

        @keyframes wrong {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* 學習提示彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 20px;
        }

        .modal-answer {
            font-size: 2.5rem;
            font-weight: 800;
            color: #15803d;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .speak-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .speak-btn:hover {
            transform: scale(1.1);
        }

        .modal-hint {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 15px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 15px;
        }

        .modal-your-answer {
            font-size: 0.9rem;
            color: #ef4444;
            margin-bottom: 25px;
        }

        .modal-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(34,197,94,0.4);
        }

        /* 結果畫面 */
        .result-screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-card {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .result-title.success { color: #15803d; }
        .result-title.retry { color: #f97316; }

        .result-message {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .result-stat {
            text-align: center;
        }

        .result-stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #22c55e;
        }

        .result-stat-label {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .result-btn.primary {
            color: white;
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .result-btn.secondary {
            color: #6b7280;
            background: #f3f4f6;
        }

        .result-btn:hover {
            transform: translateY(-3px);
        }

        /* 複習區域 */
        .review-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .review-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .review-subtitle {
            font-size: 1rem;
            font-weight: 600;
            color: #ef4444;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fee2e2;
        }

        .review-subtitle.correct {
            color: #22c55e;
            border-color: #dcfce7;
            margin-top: 25px;
        }

        .review-items {
            display: grid;
            gap: 15px;
        }

        .review-item {
            background: #f9fafb;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .review-item.wrong {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
        }

        .review-item.right {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
        }

        .review-emoji {
            font-size: 2.5rem;
        }

        .review-content {
            flex: 1;
            min-width: 150px;
        }

        .review-answer {
            font-size: 1.3rem;
            font-weight: 700;
            color: #374151;

        // ===============================
        // 音效系統
        // ===============================
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.soundOn) return;
            
            try {
                initAudio();
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                const now = audioContext.currentTime;

                switch(type) {
                    case 'start':
                        // 歡樂上升音階
                        playMelody([262, 330, 392, 523], 0.15);
                        return;
                    case 'correct':
                        // 開心叮咚聲
                        oscillator.frequency.setValueAtTime(880, now);
                        oscillator.frequency.setValueAtTime(1100, now + 0.1);
                        gainNode.gain.setValueAtTime(0.3, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        oscillator.start(now);
                        oscillator.stop(now + 0.3);
                        break;
                    case 'wrong':
                        // 輕柔提示音
                        oscillator.frequency.setValueAtTime(300, now);
                        oscillator.frequency.setValueAtTime(250, now + 0.1);
                        gainNode.gain.setValueAtTime(0.2, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        oscillator.start(now);
                        oscillator.stop(now + 0.3);
                        break;
                    case 'success':
                        // 勝利旋律
                        playMelody([262, 294, 330, 349, 392, 440, 494, 523], 0.12);
                        return;
                    case 'click':
                        // 點擊聲
                        oscillator.frequency.setValueAtTime(600, now);
                        gainNode.gain.setValueAtTime(0.1, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        oscillator.start(now);
                        oscillator.stop(now + 0.1);
                        break;
                }
            } catch (e) {
                console.log('音效播放失敗:', e);
            }
        }

        function playMelody(notes, duration) {
            try {
                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    
                    const startTime = audioContext.currentTime + i * duration;
                    const endTime = audioContext.currentTime + (i + 1) * duration;
                    
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, endTime);
                    osc.start(startTime);
                    osc.stop(endTime);
                });
            } catch (e) {
                console.log('旋律播放失敗:', e);
            }
        }

            const levelKeys = Object.keys(levelInfo);
            
            levelKeys.forEach(key => {
                const info = levelInfo[key];
                const isLocked = gameState.exp < info.requiredExp;
                const progress = gameState.levelProgress[key] || 0;
                
                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''}`;
                card.innerHTML = `
                    <div class="level-header ${key}"></div>
                    <div class="level-content">
                        <div class="level-icon">${info.icon}</div>
                        <div class="level-name">${info.name}</div>
                        <div class="level-desc">${info.desc}</div>
                        <div class="level-progress">
                            <div class="level-progress-fill" style="width: ${progress * 10}%"></div>
                        </div>
                        <div class="level-score">最高：${progress}/10</div>
                    </div>
                    ${isLocked ? `
                        <div class="level-lock-overlay">
                            <div class="lock-icon">🔒</div>
                            <div class="lock-text">需要 ${info.requiredExp} 經驗值</div>
                        </div>
                    ` : ''}
                `;
                
                if (!isLocked) {
                    card.onclick = () => startLevel(key);
                }
                
                grid.appendChild(card);
            });

                hearts: 3,
                results: []
            };
            
            // 準備題目
            if (levelKey === 'rainbow') {
                // 彩虹山頂：綜合挑戰
                const allQuestions = [];
                // 3題國字
                allQuestions.push(...shuffleArray(questionBank.mushroom).slice(0, 3));
                // 3題語詞
                allQuestions.push(...shuffleArray(questionBank.oak).slice(0, 3));
                // 2題造句
                allQuestions.push(...shuffleArray(questionBank.firefly).slice(0, 2));
                // 2題成語
                allQuestions.push(...shuffleArray(questionBank.treehouse).slice(0, 2));
                currentGame.questions = shuffleArray(allQuestions);
            } else {
                currentGame.questions = shuffleArray([...questionBank[levelKey]]);
            }
            
            showScreen('gameScreen');
            updateGameHeader();
            showQuestion();
        }

        // 洗牌函數
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // ===============================
        // 遊戲畫面更新
        // ===============================
        function updateGameHeader() {
            const info = levelInfo[currentGame.levelKey];
            document.getElementById('gameLevelName').innerHTML = `${info.icon} ${info.name}`;
            document.getElementById('gameProgress').textContent = `第 ${currentGame.currentIndex + 1}/10 題`;
            
            // 更新愛心
            const heartsContainer = document.getElementById('gameHearts');
            heartsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart' + (i >= currentGame.hearts ? ' lost' : '');
                heart.textContent = '❤️';
                heartsContainer.appendChild(heart);
            }
        }

        function showQuestion() {
            const question = currentGame.questions[currentGame.currentIndex];
            
            document.getElementById('questionImage').textContent = question.emoji;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('questionHint').textContent = question.hint;
            
            // 隨機排列選項
            const shuffledOptions = shuffleArray([...question.options]);
            
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            
            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option);
                grid.appendChild(btn);
            });
        }

        // ===============================
        // 檢查答案
        // ===============================
        function checkAnswer(selected) {
            const question = currentGame.questions[currentGame.currentIndex];
            const isCorrect = selected === question.answer;
            
            // 禁用所有按鈕
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === question.answer) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selected && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });
            
            // 記錄結果
            currentGame.results.push({
                question: question,
                userAnswer: selected,
                correct: isCorrect
            });
            
            if (isCorrect) {
                currentGame.score++;
                playSound('correct');
                
                setTimeout(() => {
                    nextQuestion();
                }, 800);
            } else {
                currentGame.hearts--;
                playSound('wrong');
                updateGameHeader();
                
                // 顯示學習提示
                setTimeout(() => {
                    showLearnModal(question, selected);
                }, 800);
            }
        }

        // ===============================
        // 學習提示彈窗
        // ===============================
        function showLearnModal(question, userAnswer) {
            document.getElementById('modalAnswer').textContent = question.answer;
            document.getElementById('modalHint').textContent = question.hint;
            document.getElementById('modalYourAnswer').textContent = userAnswer;
            document.getElementById('learnModal').classList.add('show');
            
            // 自動朗讀正確答案
            setTimeout(() => {
                speakChinese(question.answer);
            }, 500);
        }

        function closeLearnModal() {
            document.getElementById('learnModal').classList.remove('show');
            nextQuestion();
        }

        // ===============================
        // 下一題
        // ===============================
        function nextQuestion() {
            currentGame.currentIndex++;
            
            // 檢查是否遊戲結束
            if (currentGame.currentIndex >= 10 || currentGame.hearts <= 0) {
                endGame();
                return;
            }
            
            updateGameHeader();
            showQuestion();
        }

        // ===============================
        // 遊戲結束
        // ===============================
        function endGame() {
            const passed = currentGame.score >= 6;
            const earnedExp = currentGame.score * 5;
            const earnedGold = currentGame.score * 10;
            
            // 更新遊戲狀態
            gameState.exp += earnedExp;
            gameState.gold += earnedGold;
            
            // 更新關卡最高分
            if (currentGame.score > gameState.levelProgress[currentGame.levelKey]) {
                gameState.levelProgress[currentGame.levelKey] = currentGame.score;
            }
            
            // 記錄
            gameState.records.push({
                level: currentGame.levelKey,
                score: currentGame.score,
                passed: passed,
                date: new Date().toLocaleDateString('zh-TW')
            });
            
            saveGameState();
            
            // 音效
            playSound(passed ? 'success' : 'wrong');
            
            // 顯示結果
            showResultScreen(passed, earnedExp, earnedGold);
        }

        function showResultScreen(passed, earnedExp, earnedGold) {
            showScreen('resultScreen');
            
            if (passed) {
                document.getElementById('resultIcon').textContent = '🎉';
                document.getElementById('resultTitle').textContent = `${gameState.playerName}好棒！`;
                document.getElementById('resultTitle').className = 'result-title success';
                document.getElementById('resultMessage').textContent = '你又學會了好多國字！繼續加油，成為國語小達人！';
            } else {
                document.getElementById('resultIcon').textContent = '🦊';
                document.getElementById('resultTitle').textContent = '沒關係！';
                document.getElementById('resultTitle').className = 'result-title retry';
                document.getElementById('resultMessage').textContent = `多練習幾次，${gameState.playerName}一定可以的！我們再試一次吧！`;
            }
            
            document.getElementById('resultScore').textContent = `${currentGame.score}/10`;
            document.getElementById('resultExp').textContent = `+${earnedExp}`;
            document.getElementById('resultGold').textContent = `+${earnedGold}`;
            
            // 渲染複習區域
            renderReview();
        }

        // ===============================
        // 複習區域
        // ===============================
        function renderReview() {
            const container = document.getElementById('reviewContent');
            container.innerHTML = '';
            
            // 分類：答錯和答對
            const wrongAnswers = currentGame.results.filter(r => !r.correct);
            const rightAnswers = currentGame.results.filter(r => r.correct);
            
            // 答錯的題目（需要加強）
            if (wrongAnswers.length > 0) {
                const wrongSection = document.createElement('div');
                wrongSection.innerHTML = `<div class="review-subtitle">❌ 需要加強複習</div>`;
                
                const wrongItems = document.createElement('div');
                wrongItems.className = 'review-items';
                
                wrongAnswers.forEach(result => {
                    wrongItems.appendChild(createReviewItem(result, true));
                });
                
                wrongSection.appendChild(wrongItems);
                container.appendChild(wrongSection);
            }
            
            // 答對的題目
            if (rightAnswers.length > 0) {
                const rightSection = document.createElement('div');
                rightSection.innerHTML = `<div class="review-subtitle correct">✅ 答對的題目</div>`;
                
                const rightItems = document.createElement('div');
                rightItems.className = 'review-items';
                
                rightAnswers.forEach(result => {
                    rightItems.appendChild(createReviewItem(result, false));
                });
                
                rightSection.appendChild(rightItems);
                container.appendChild(rightSection);
            }
        }

        function createReviewItem(result, isWrong) {
            const item = document.createElement('div');
            item.className = `review-item ${isWrong ? 'wrong' : 'right'}`;
            
            item.innerHTML = `
                <div class="review-emoji">${result.question.emoji}</div>
                <div class="review-content">
                    <div class="review-answer">
                        ${isWrong ? '' : '⭐ '}${result.question.answer}
                    </div>
                    <div class="review-hint">💡 ${result.question.hint}</div>
                    ${isWrong ? `<div class="review-wrong-answer">你的答案：${result.userAnswer}</div>` : ''}
                </div>
                <button class="review-speak-btn" onclick="speakChinese('${result.question.answer}')">🔊</button>
            `;
            
            return item;
        }

        // ===============================
        // 返回與重試
        // ===============================
        function backToMenu() {
            playSound('click');
            showScreen('mainMenu');
            updatePlayerCard();
            renderLevelCards();
        }

        function retryLevel() {
            playSound('click');
            startLevel(currentGame.levelKey);
        }

        // ===============================
        // 頁面載入
        // ===============================
        window.onload = init;
    </script>
</body>
</html>
